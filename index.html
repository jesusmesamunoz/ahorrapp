<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Ahorrapp</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #ffffff; --ink: #0b0b0b; --muted: #52514e; --accent: #3d7bf7; --line: rgba(11,11,11,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0c10; --card: #16171c; --ink: #ffffff; --muted: #c3c2b7; --accent: #5e97ff; --line: rgba(255,255,255,.08); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, sans-serif; padding: 32px 16px 48px; }
  main { max-width: 680px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 6px; }
  p, li { color: var(--muted); }
  ul { padding-left: 20px; }
  .date { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Ahorrapp 🐷</h1>
<p class="date">App personal para iPhone</p>
<p>Ahorrapp es una app personal y privada para consultar y analizar los gastos de su titular. El acceso a las cuentas es de solo lectura y todos los datos se quedan en su iPhone.</p>
<ul>
  <li><a href="privacidad.html">Política de privacidad</a></li>
  <li><a href="condiciones.html">Condiciones de uso</a></li>
</ul>
</main>
</body>
</html>
